name: Update rates

on:
  schedule:
    - cron: "0 3 * * *"   # প্রতিদিন (UTC ০৩:০০ = বাংলাদেশ সকাল ৯:০০)
  workflow_dispatch:       # হাতে চালানোর বাটন

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site
        run: python generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update rates"
          git push
